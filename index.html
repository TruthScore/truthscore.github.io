<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <title>TruthScore.ai — The nutrition label for news</title>
    <meta name="description" content="TruthScore gives every article a credibility score — built by AI, refined by community, readable in seconds." />
    <meta name="author" content="TruthScore.ai" />

    <meta property="og:title" content="TruthScore.ai — The nutrition label for news" />
    <meta property="og:description" content="TruthScore gives every article a credibility score — built by AI, refined by community, readable in seconds." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@truthscore_ai" />
    <meta name="twitter:image" content="/og-image.png" />

    <script>
      // SPA routing: restore the path encoded by 404.html. Only a same-site absolute path is
      // accepted, and a bad value leaves the URL as it is rather than stopping the page.
      (function() {
        try {
          var q = new URLSearchParams(window.location.search);
          var p = q.get('p');
          if (p && /^\/(?![\/\\])/.test(p)) {
            var h = q.get('h');
            window.history.replaceState(null, '', p + (h ? '#' + h : ''));
          }
        } catch (e) {}
      })();
    </script>

    <!-- Google Analytics is not loaded here: src/lib/analytics.ts adds gtag.js only after the
         visitor accepts in the cookie banner (src/components/CookieConsent.tsx). -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
